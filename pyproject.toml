[project]
name = "scout-alert-bridge"
version = "0.1.0"
description = "Polls JPL Scout and publishes Rubin ToO candidate NEO events to Kafka (SCiMMA Hopskotch)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Tim Lister", email = "tlister@lco.global" }]
dependencies = [
    "tomtoolkit>=3.0.1",
    "tom-jpl>=0.3.0",
    "hop-client>=0.9",
    "psycopg[binary]>=3",
]

[dependency-groups]
dev = [
    "ruff",
    "jsonschema",
    "factory-boy>3.2.1,<3.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bridge", "scout_publisher"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*/migrations/*"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
