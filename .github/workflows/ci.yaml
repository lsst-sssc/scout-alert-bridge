name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Pinned to the same uv the Dockerfile builds with, so CI and the image agree.
      # setup-uv stopped publishing moving major tags after v7, so this pins the full
      # version -- @v10 does not resolve.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.1'
          enable-cache: true
      # --frozen installs exactly what uv.lock pins and fails if the lockfile and
      # pyproject.toml have drifted, rather than quietly re-resolving. The dev group
      # carries ruff and jsonschema (the latter validates schema/event-1.0.json against
      # generated payloads); the image excludes it with --no-dev.
      - name: Install
        run: uv sync --frozen --group dev
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Test
        run: uv run --frozen python manage.py test

  publish-image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
